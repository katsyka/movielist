<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A24 / PSYCHOLOGICAL ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=Cinzel:wght@800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --border: #e2e2e2;
      --muted: #666666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; line-height: 1.3; }

    header {
      position: sticky; top: 0; background: #fff; z-index: 50;
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }
    .menu-trigger { background: none; border: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; cursor: pointer; justify-self: start; }
    .brand-logo { font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 800; text-decoration: none; color: #000; text-align: center; }
    .log-btn {
      justify-self: end; background: #000; color: #fff; border: none;
      padding: 0.5rem 1.2rem; font-weight: 700; text-transform: uppercase; font-size: 0.8rem;
      letter-spacing: 0.05em; cursor: pointer;
    }

    /* CONTROLS */
    .controls { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 1rem; }
    .tab-btn { background: none; border: none; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.08em; cursor: pointer; color: var(--muted); margin-right: 1.5rem; padding-bottom: 4px; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #000; border-color: #000; }

    /* FILM GRID */
    .film-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 3rem 2rem; padding: 2.5rem 2rem; }
    .film-card { cursor: pointer; display: flex; flex-direction: column; gap: 0.75rem; }
    .poster-wrapper { position: relative; width: 100%; aspect-ratio: 16/10; background: #eee; overflow: hidden; }
    .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .film-card:hover .poster-wrapper img { transform: scale(1.04); }
    .badge { position: absolute; top: 12px; right: 12px; background: #000; color: #fff; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 3px 6px; }
    .film-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .film-credits { font-size: 0.8rem; color: var(--muted); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.2s ease; padding: 1.5rem; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: #fff; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; border: 1px solid #000; padding: 2rem; position: relative; }
    .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; font-weight: 800; font-size: 1.2rem; cursor: pointer; }

    .api-search-box { width: 100%; border: 2px solid #000; padding: 0.9rem; font-size: 1.1rem; font-weight: 700; outline: none; margin-bottom: 1.2rem; font-family: inherit; }
    .search-results { display: flex; flex-direction: column; gap: 0.75rem; max-height: 360px; overflow-y: auto; }
    .search-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border: 1px solid var(--border); cursor: pointer; transition: 0.15s; }
    .search-item:hover { background: #000; color: #fff; }
    .search-item img { width: 45px; height: 65px; object-fit: cover; background: #ddd; }

    .error-box { background: #ffebee; border: 1px solid #c62828; color: #c62828; padding: 1rem; font-size: 0.85rem; margin-bottom: 1rem; }
    .slider-group { margin: 1.25rem 0; }
    .slider-group label { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.4rem; }
    .slider-group input[type="range"] { width: 100%; accent-color: #000; }
  </style>
</head>
<body>

  <header>
    <button class="menu-trigger" onclick="alert('Use filters or + Search & Add!')">Menu</button>
    <a href="#" class="brand-logo">A24</a>
    <button class="log-btn" onclick="openSearchModal()">+ Search & Add</button>
  </header>

  <section class="controls">
    <div>
      <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">My Archive</button>
      <button class="tab-btn" id="tab-top" onclick="setFilter('top')">Top Ranked</button>
      <button class="tab-btn" id="tab-watched" onclick="setFilter('watched')">Watched</button>
      <button class="tab-btn" id="tab-watchlist" onclick="setFilter('watchlist')">Watchlist</button>
    </div>
  </section>

  <main class="film-grid" id="filmGrid"></main>

  <!-- SEARCH MODAL -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('searchModal')">✕</button>
      <h2 style="font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem; text-transform: uppercase;">Search Real Film Database</h2>
      
      <div id="apiStatusBanner"></div>
      
      <input type="text" class="api-search-box" id="tmdbQuery" placeholder="Type title: Hereditary, Midsommar, The Substance..." oninput="handleTyping()">
      
      <div class="search-results" id="searchResults">
        <p style="color: var(--muted); font-size: 0.85rem; text-transform: uppercase;">Start typing any movie title above...</p>
      </div>
    </div>
  </div>

  <!-- CONFIGURE & SAVE MODAL -->
  <div class="modal-overlay" id="saveModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('saveModal')">✕</button>
      <div id="savePreview"></div>
      
      <div class="slider-group">
        <label><span>Dread / Mindfuck Score</span><span id="dreadVal">8/10</span></label>
        <input type="range" id="dreadInput" min="1" max="10" value="8" oninput="document.getElementById('dreadVal').innerText = this.value + '/10'">
      </div>

      <div class="slider-group">
        <label><span>Personal Rating</span><span id="ratingVal">9/10</span></label>
        <input type="range" id="ratingInput" min="1" max="10" value="9" oninput="document.getElementById('ratingVal').innerText = this.value + '/10'">
      </div>

      <div style="margin: 1.25rem 0;">
        <label style="font-weight: 700; font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 0.5rem;">Status</label>
        <select id="saveStatus" style="width: 100%; padding: 0.75rem; border: 1px solid #000; font-weight: 700;">
          <option value="watched">Mark as Watched (Diary)</option>
          <option value="watchlist">Add to Watchlist</option>
        </select>
      </div>

      <button class="log-btn" style="width: 100%; padding: 1rem; font-size: 0.9rem;" onclick="confirmSaveFilm()">Save to My Collection</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://a24.kviappsgames.workers.dev";
    let myFilms = JSON.parse(localStorage.getItem('a24_saved_films')) || [];
    let currentFilter = 'all';
    let selectedFilm = null;
    let debounceTimer;

    function openSearchModal() {
      document.getElementById('searchModal').classList.add('active');
      document.getElementById('tmdbQuery').focus();
      checkWorkerHealth();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // Health check to inform the user if TMDB key is missing
    async function checkWorkerHealth() {
      const banner = document.getElementById('apiStatusBanner');
      try {
        const res = await fetch(`${WORKER_URL}/api/health`);
        const data = await res.json();
        if (!data.has_tmdb_key) {
          banner.innerHTML = `
            <div class="error-box">
              ⚠️ <b>TMDB Key Missing:</b> Please add <code>TMDB_API_KEY</code> into Cloudflare Worker Settings -> Variables & Secrets.
            </div>`;
        } else {
          banner.innerHTML = '';
        }
      } catch (e) {
        banner.innerHTML = `<div class="error-box">⚠️ Could not connect to Worker at <code>${WORKER_URL}</code>. Check worker deployment.</div>`;
      }
    }

    function handleTyping() {
      clearTimeout(debounceTimer);
      const query = document.getElementById('tmdbQuery').value.trim();
      const container = document.getElementById('searchResults');
      
      if (!query) {
        container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">Start typing any movie title above...</p>';
        return;
      }

      container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">Searching TMDB database...</p>';

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`${WORKER_URL}/api/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (!res.ok || data.error) {
            container.innerHTML = `<div class="error-box"><b>API Error:</b> ${data.error || 'Check TMDB key in Cloudflare'}</div>`;
            return;
          }

          if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">No films discovered with that name.</p>';
            return;
          }

          container.innerHTML = data.slice(0, 8).map(m => `
            <div class="search-item" onclick="fetchAndSelect('${m.id}')">
              <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w92' + m.poster_path : 'https://placehold.co/92x138/black/white?text=No+Img'}">
              <div>
                <strong style="font-size: 1.05rem; display:block;">${m.title}</strong>
                <span style="font-size: 0.8rem; opacity: 0.7;">${m.release_date ? m.release_date.split('-')[0] : 'N/A'}</span>
              </div>
            </div>
          `).join('');
        } catch (err) {
          container.innerHTML = `<div class="error-box">Network Error: ${err.message}</div>`;
        }
      }, 350);
    }

    async function fetchAndSelect(tmdbId) {
      closeModal('searchModal');
      const res = await fetch(`${WORKER_URL}/api/fetch-movie/${tmdbId}`);
      selectedFilm = await res.json();

      document.getElementById('savePreview').innerHTML = `
        <div style="display:flex; gap: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
          <img src="${selectedFilm.poster}" style="width: 140px; aspect-ratio: 16/10; object-fit: cover;">
          <div>
            <h2 style="font-size: 1.5rem; font-weight: 900;">${selectedFilm.title} (${selectedFilm.year})</h2>
            <p style="font-size: 0.85rem; color: var(--muted); margin: 0.25rem 0;"><b>Director:</b> ${selectedFilm.director}</p>
            <p style="font-size: 0.85rem; color: var(--muted);"><b>Cast:</b> ${selectedFilm.starring}</p>
          </div>
        </div>
      `;
      document.getElementById('saveModal').classList.add('active');
    }

    async function confirmSaveFilm() {
      const film = {
        ...selectedFilm,
        dreadScore: parseInt(document.getElementById('dreadInput').value),
        userRating: parseInt(document.getElementById('ratingInput').value),
        status: document.getElementById('saveStatus').value
      };

      myFilms = myFilms.filter(f => f.id !== film.id);
      myFilms.unshift(film);
      localStorage.setItem('a24_saved_films', JSON.stringify(myFilms));

      try {
        await fetch(`${WORKER_URL}/api/films`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(film)
        });
      } catch (e) {}

      closeModal('saveModal');
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`tab-${filter}`);
      if (btn) btn.classList.add('active');
      render();
    }

    function render() {
      const grid = document.getElementById('filmGrid');
      let list = [...myFilms];

      if (currentFilter === 'watched') list = list.filter(f => f.status === 'watched');
      if (currentFilter === 'watchlist') list = list.filter(f => f.status === 'watchlist');
      if (currentFilter === 'top') list = list.sort((a,b) => b.userRating - a.userRating).slice(0, 10);

      if (!list.length) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 4rem; text-align: center; color: var(--muted); text-transform:uppercase; letter-spacing:0.08em;">No films in collection. Click "+ Search & Add" above to start.</div>`;
        return;
      }

      grid.innerHTML = list.map((f, idx) => `
        <article class="film-card">
          <div class="poster-wrapper">
            <img src="${f.poster}" alt="${f.title}">
            <div class="badge">${f.status === 'watched' ? 'Watched' : 'Watchlist'}</div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--muted); font-weight:700;">
            <span>${currentFilter === 'top' ? `TOP #${idx + 1} — ` : ''}${f.year}</span>
            <span>RATING: ${f.userRating}/10</span>
          </div>
          <h3 class="film-title">${f.title}</h3>
          <p class="film-credits"><b>DIR.</b> ${f.director} &nbsp;•&nbsp; <b>CAST:</b> ${f.starring}</p>
        </article>
      `).join('');
    }

    render();
  </script>
</body>
</html>
