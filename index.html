<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A24 — Film Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --border: #e5e5e5;
      --muted: #707070;
      --drawer-width: 320px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* HEADER */
    header {
      position: sticky; top: 0; background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      z-index: 80;
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .menu-trigger {
      background: none; border: none;
      font-size: 0.8rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; justify-self: start;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .menu-trigger span { display: inline-block; width: 14px; height: 2px; background: #000; }
    .brand-logo-img { height: 26px; object-fit: contain; cursor: pointer; }
    .header-actions { justify-self: end; display: flex; gap: 0.75rem; align-items: center; }
    .log-btn {
      background: #000; color: #fff; border: 1px solid #000;
      padding: 0.55rem 1.25rem; font-weight: 800; text-transform: uppercase;
      font-size: 0.75rem; letter-spacing: 0.06em; cursor: pointer;
      transition: background 0.15s ease;
    }
    .log-btn:hover { background: #222; }

    /* A24 SIDE DRAWER MENU */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 250; opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .drawer-overlay.active { opacity: 1; visibility: visible; }
    .side-drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 100%; max-width: 360px;
      background: #000000; color: #ffffff;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
      padding: 2.5rem 2rem; justify-content: space-between;
    }
    .side-drawer.active { transform: translateX(0); }
    .drawer-close {
      background: none; border: none; color: #fff;
      font-size: 0.85rem; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .drawer-nav { display: flex; flex-direction: column; gap: 1.1rem; margin-top: 2.5rem; }
    .drawer-link {
      color: #fff; font-size: 2.35rem; font-weight: 900;
      letter-spacing: -0.03em; line-height: 1.05; text-decoration: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .drawer-link:hover { opacity: 0.65; transform: translateX(4px); }
    .drawer-footer { font-size: 0.75rem; color: #777; text-transform: uppercase; letter-spacing: 0.05em; }

    /* CONTROLS BAR */
    .controls {
      padding: 1.25rem 2rem; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 1rem;
    }
    .tab-btn {
      background: none; border: none; font-weight: 800;
      text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.08em;
      cursor: pointer; color: var(--muted); margin-right: 1.75rem;
      padding-bottom: 4px; border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tab-btn.active { color: #000; border-color: #000; }

    /* FILM GRID */
    .film-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 3.5rem 2.25rem; padding: 2.5rem 2rem;
    }
    .film-card { cursor: pointer; display: flex; flex-direction: column; gap: 0.8rem; }
    .poster-wrapper {
      position: relative; width: 100%; aspect-ratio: 16/10;
      background: #111; overflow: hidden;
    }
    .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .film-card:hover .poster-wrapper img { transform: scale(1.05); }
    .badge {
      position: absolute; top: 12px; right: 12px; background: #000; color: #fff;
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
      padding: 4px 7px; letter-spacing: 0.05em;
    }
    .film-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }
    .film-credits { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }

    /* DEDICATED FILM PAGE VIEW (A24 HERO LAYOUT) */
    #filmPageView { display: none; }
    .film-hero {
      position: relative; width: 100%; min-height: 65vh; max-height: 80vh;
      background: #000; overflow: hidden; display: flex; align-items: flex-end;
    }
    .film-hero-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.85; filter: brightness(0.95);
    }
    .film-hero-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%, transparent 100%);
    }
    .film-hero-title-wrap {
      position: relative; z-index: 10; padding: 3rem 2.5rem; color: #fff;
    }
    .film-hero-title {
      font-size: clamp(3rem, 7vw, 6.5rem); font-weight: 900;
      letter-spacing: -0.04em; line-height: 0.95; margin-bottom: 0.5rem;
    }
    .film-hero-tagline { font-size: 1.1rem; font-style: italic; opacity: 0.85; font-weight: 400; }

    /* 3-COLUMN METADATA SECTION */
    .film-meta-grid {
      padding: 3rem 2.5rem;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 3rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .meta-block h4 {
      font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.6rem;
    }
    .meta-block p, .meta-block div {
      font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2;
    }
    .meta-block .sub-names { font-size: 1.4rem; font-weight: 800; color: #111; }
    
    .action-select-btn {
      width: 100%; border: 1px solid #000; padding: 0.9rem 1.2rem;
      font-size: 0.85rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.05em; background: #fff; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .action-select-btn:hover { background: #000; color: #fff; }

    /* SYNOPSIS & EXTRA DETAILS */
    .film-body-grid {
      padding: 3rem 2.5rem; display: grid; grid-template-columns: 2fr 1fr; gap: 3.5rem;
      border-bottom: 1px solid var(--border);
    }
    .synopsis-text { font-size: 1.25rem; line-height: 1.6; font-weight: 500; }
    .side-details { display: flex; flex-direction: column; gap: 1.5rem; font-size: 0.85rem; }
    .side-row { border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .side-row span:first-child { text-transform: uppercase; font-weight: 800; color: var(--muted); font-size: 0.75rem; display: block; margin-bottom: 3px; }
    .side-row span:last-child { font-weight: 700; }

    /* POSTER ARCHIVE & MEDIA GALLERY */
    .gallery-section { padding: 3rem 2.5rem; }
    .section-heading { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; margin-bottom: 1.5rem; }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      position: relative; background: #eee; overflow: hidden; border: 1px solid var(--border);
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .gallery-item:hover img { transform: scale(1.04); }
    .gallery-label {
      padding: 0.5rem; font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
      background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: space-between;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px); z-index: 400; display: flex;
      align-items: center; justify-content: center; opacity: 0;
      visibility: hidden; transition: 0.2s ease; padding: 1.5rem;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: #fff; width: 100%; max-width: 680px; max-height: 90vh;
      overflow-y: auto; border: 1px solid #000; padding: 2rem; position: relative;
    }
    .modal-close {
      position: absolute; top: 1.5rem; right: 1.5rem; background: none;
      border: none; font-weight: 800; font-size: 1.3rem; cursor: pointer;
    }
    .api-search-box {
      width: 100%; border: 2px solid #000; padding: 1rem; font-size: 1.1rem;
      font-weight: 700; outline: none; margin-bottom: 1.2rem; font-family: inherit;
    }
    .search-results { display: flex; flex-direction: column; gap: 0.75rem; max-height: 380px; overflow-y: auto; }
    .search-item {
      display: flex; align-items: center; gap: 1.2rem; padding: 0.75rem;
      border: 1px solid var(--border); cursor: pointer; transition: 0.15s;
    }
    .search-item:hover { background: #000; color: #fff; }
    .search-item img { width: 50px; height: 75px; object-fit: cover; background: #ddd; }
    .error-box { background: #ffebee; border: 1px solid #c62828; color: #c62828; padding: 1rem; font-size: 0.85rem; margin-bottom: 1rem; }
    .slider-group { margin: 1.25rem 0; }
    .slider-group label { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.4rem; }
    .slider-group input[type="range"] { width: 100%; accent-color: #000; }

    @media (max-width: 900px) {
      .film-meta-grid { grid-template-columns: 1fr; gap: 2rem; }
      .film-body-grid { grid-template-columns: 1fr; gap: 2rem; }
      header { padding: 1rem; }
      .film-grid, .film-hero-title-wrap, .film-meta-grid, .film-body-grid, .gallery-section { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- SIDE MENU DRAWER (Authentic A24 Style) -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div>
      <button class="drawer-close" onclick="toggleDrawer(false)">✕ CLOSE</button>
      <nav class="drawer-nav">
        <a class="drawer-link" onclick="navigateHome('all')">Films</a>
        <a class="drawer-link" onclick="navigateHome('watched')">Watched</a>
        <a class="drawer-link" onclick="navigateHome('watchlist')">Watchlist</a>
        <a class="drawer-link" onclick="navigateHome('top')">Top Ranked</a>
        <a class="drawer-link" onclick="openSearchModal(); toggleDrawer(false);">Search TMDB</a>
        <a class="drawer-link" onclick="alert('A24 Shop Archive & Screenplay Books'); toggleDrawer(false);">Shop</a>
        <a class="drawer-link" onclick="alert('AAA24 Member Perks Active'); toggleDrawer(false);">Membership</a>
      </nav>
    </div>
    <div class="drawer-footer">
      <p>© A24 PSYCHOLOGICAL ARCHIVE</p>
      <p style="margin-top: 4px; font-size: 0.65rem;">POWERED BY TMDB & CLOUDFLARE</p>
    </div>
  </aside>

  <!-- HEADER -->
  <header>
    <button class="menu-trigger" onclick="toggleDrawer(true)">
      <span></span> MENU
    </button>
    <a href="#" onclick="showHomeView()">
      <img src="https://images.seeklogo.com/logo-png/31/2/a24-films-logo-png_seeklogo-316223.png" alt="A24" class="brand-logo-img">
    </a>
    <div class="header-actions">
      <button class="log-btn" onclick="openSearchModal()">+ Search & Add</button>
    </div>
  </header>

  <!-- HOME ARCHIVE VIEW -->
  <div id="homeView">
    <section class="controls">
      <div>
        <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">All Films</button>
        <button class="tab-btn" id="tab-top" onclick="setFilter('top')">Top Ranked</button>
        <button class="tab-btn" id="tab-watched" onclick="setFilter('watched')">Watched</button>
        <button class="tab-btn" id="tab-watchlist" onclick="setFilter('watchlist')">Watchlist</button>
      </div>
      <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--muted);" id="itemCountLabel">
        0 FILMS
      </div>
    </section>

    <main class="film-grid" id="filmGrid"></main>
  </div>

  <!-- SINGLE DEDICATED FILM PAGE VIEW -->
  <div id="filmPageView"></div>

  <!-- SEARCH MODAL -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('searchModal')">✕</button>
      <h2 style="font-size: 1.4rem; font-weight: 900; margin-bottom: 1rem; text-transform: uppercase;">Search Global Film Database</h2>
      <div id="apiStatusBanner"></div>
      <input type="text" class="api-search-box" id="tmdbQuery" placeholder="Type title: Hereditary, Tony, Talk to Me, The Whale..." oninput="handleTyping()">
      <div class="search-results" id="searchResults">
        <p style="color: var(--muted); font-size: 0.85rem; text-transform: uppercase;">Start typing any film title above...</p>
      </div>
    </div>
  </div>

  <!-- LOG / EDIT MODAL -->
  <div class="modal-overlay" id="saveModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('saveModal')">✕</button>
      <div id="savePreview"></div>
      
      <div class="slider-group">
        <label><span>Dread / Mindfuck Intensity</span><span id="dreadVal">8/10</span></label>
        <input type="range" id="dreadInput" min="1" max="10" value="8" oninput="document.getElementById('dreadVal').innerText = this.value + '/10'">
      </div>

      <div class="slider-group">
        <label><span>Personal Film Rating</span><span id="ratingVal">9/10</span></label>
        <input type="range" id="ratingInput" min="1" max="10" value="9" oninput="document.getElementById('ratingVal').innerText = this.value + '/10'">
      </div>

      <div style="margin: 1.25rem 0;">
        <label style="font-weight: 800; font-size: 0.8rem; text-transform: uppercase; display: block; margin-bottom: 0.5rem;">Collection Status</label>
        <select id="saveStatus" style="width: 100%; padding: 0.75rem; border: 1px solid #000; font-weight: 700;">
          <option value="watched">Mark as Watched</option>
          <option value="watchlist">Save to Watchlist</option>
        </select>
      </div>

      <button class="log-btn" style="width: 100%; padding: 1rem; font-size: 0.85rem;" onclick="confirmSaveFilm()">Save to Collection</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://a24.kviappsgames.workers.dev";
    
    // Default starter films if user library is empty
    const DEFAULT_SEED_FILMS = [
      {
        id: "493922",
        title: "Hereditary",
        year: 2018,
        director: "Ari Aster",
        starring: "Toni Collette, Alex Wolff, Milly Shapiro",
        status: "watched",
        userRating: 10,
        dreadScore: 10,
        poster: "https://image.tmdb.org/t/p/w1280/yV04qP2u233P8x9P1p2iW3pL3O7.jpg"
      }
    ];

    let myFilms = JSON.parse(localStorage.getItem('a24_saved_films')) || DEFAULT_SEED_FILMS;
    let currentFilter = 'all';
    let selectedFilm = null;
    let debounceTimer;

    function toggleDrawer(open) {
      document.getElementById('sideDrawer').classList.toggle('active', open);
      document.getElementById('drawerOverlay').classList.toggle('active', open);
    }

    function navigateHome(filter = 'all') {
      toggleDrawer(false);
      showHomeView();
      setFilter(filter);
    }

    function showHomeView() {
      document.getElementById('filmPageView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderGrid();
    }

    function openSearchModal() {
      document.getElementById('searchModal').classList.add('active');
      document.getElementById('tmdbQuery').focus();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`tab-${filter}`);
      if (btn) btn.classList.add('active');
      renderGrid();
    }

    function handleTyping() {
      clearTimeout(debounceTimer);
      const query = document.getElementById('tmdbQuery').value.trim();
      const container = document.getElementById('searchResults');
      
      if (!query) {
        container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem; text-transform:uppercase;">Start typing any film title above...</p>';
        return;
      }

      container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem; text-transform:uppercase;">Querying TMDB...</p>';

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`${WORKER_URL}/api/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();

          if (!res.ok || data.error) {
            container.innerHTML = `<div class="error-box"><b>API Error:</b> ${data.error || 'Check TMDB key'}</div>`;
            return;
          }

          if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem;">No films found.</p>';
            return;
          }

          container.innerHTML = data.slice(0, 10).map(m => `
            <div class="search-item" onclick="openFilmPage('${m.id}')">
              <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w92' + m.poster_path : 'https://placehold.co/92x138/000/fff?text=No+Img'}">
              <div>
                <strong style="font-size: 1.05rem; display:block;">${m.title}</strong>
                <span style="font-size: 0.8rem; opacity: 0.7;">${m.release_date ? m.release_date.split('-')[0] : 'N/A'}</span>
              </div>
            </div>
          `).join('');
        } catch (err) {
          container.innerHTML = `<div class="error-box">Network Error: ${err.message}</div>`;
        }
      }, 300);
    }

    // LOAD AND DISPLAY FULL DEDICATED FILM PAGE (A24 STYLE)
    async function openFilmPage(tmdbId) {
      closeModal('searchModal');
      toggleDrawer(false);

      const filmPageView = document.getElementById('filmPageView');
      const homeView = document.getElementById('homeView');

      homeView.style.display = 'none';
      filmPageView.style.display = 'block';
      filmPageView.innerHTML = `<div style="padding: 6rem; text-align: center; font-weight: 800;">LOADING ARCHIVE RECORD...</div>`;
      window.scrollTo(0,0);

      try {
        const res = await fetch(`${WORKER_URL}/api/fetch-movie/${tmdbId}`);
        const film = await res.json();
        selectedFilm = film;

        const isSaved = myFilms.find(f => f.id === film.id);

        filmPageView.innerHTML = `
          <!-- HERO BANNER -->
          <section class="film-hero">
            <img src="${film.heroBackdrop || film.poster}" class="film-hero-bg" alt="${film.title}">
            <div class="film-hero-gradient"></div>
            <div class="film-hero-title-wrap">
              <h1 class="film-hero-title">${film.title}</h1>
              ${film.tagline ? `<p class="film-hero-tagline">“${film.tagline}”</p>` : ''}
            </div>
          </section>

          <!-- 3 COLUMN INFO (A24 LAYOUT) -->
          <section class="film-meta-grid">
            <div class="meta-block">
              <h4>DIRECTED BY</h4>
              <p>${film.director}</p>
            </div>
            
            <div class="meta-block">
              <h4>YEAR</h4>
              <p>${film.year}</p>
            </div>

            <div class="meta-block">
              <h4>LOG / ARCHIVE</h4>
              <button class="action-select-btn" onclick="openSaveModal()">
                <span>${isSaved ? `SAVED (${isSaved.status.toUpperCase()})` : 'LOG TO MY ARCHIVE'}</span>
                <span>↓</span>
              </button>
            </div>

            <div class="meta-block" style="grid-column: 1 / span 2;">
              <h4>STARRING</h4>
              <div class="sub-names">${film.starring}</div>
            </div>

            <div class="meta-block">
              <h4>GENRE / RUNTIME</h4>
              <div style="font-size: 1.1rem; font-weight:700;">${film.genres || 'Drama'} • ${film.runtime ? film.runtime + ' MIN' : 'N/A'}</div>
            </div>
          </section>

          <!-- SYNOPSIS & METRICS -->
          <section class="film-body-grid">
            <div>
              <h4 style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; letter-spacing: 0.08em;">SYNOPSIS</h4>
              <p class="synopsis-text">${film.synopsis}</p>
            </div>
            <div class="side-details">
              <div class="side-row">
                <span>Original Language</span>
                <span>${(film.language || 'English').toUpperCase()}</span>
              </div>
              <div class="side-row">
                <span>TMDB Global Rating</span>
                <span>${film.vote_average ? film.vote_average.toFixed(1) : 'N/A'} / 10 (${film.vote_count || 0} votes)</span>
              </div>
              <div class="side-row">
                <span>Budget / Box Office</span>
                <span>${film.budget ? '$' + (film.budget/1000000).toFixed(1) + 'M' : 'N/A'} / ${film.revenue ? '$' + (film.revenue/1000000).toFixed(1) + 'M' : 'N/A'}</span>
              </div>
              <div class="side-row">
                <span>Production Companies</span>
                <span>${film.production || 'A24 / Independent'}</span>
              </div>
            </div>
          </section>

          <!-- POSTER ARCHIVE & VARIANT GALLERY -->
          <section class="gallery-section">
            <h3 class="section-heading">Poster & Key Art Archive (${(film.posters || []).length} VARIANTS)</h3>
            <div class="gallery-grid">
              ${(film.posters && film.posters.length > 0) ? film.posters.map((p, i) => `
                <div class="gallery-item">
                  <img src="${p}" loading="lazy">
                  <div class="gallery-label">
                    <span>Variant #${i+1}</span>
                    <a href="${p}" target="_blank" style="font-weight:900;">HIGH-RES ↗</a>
                  </div>
                </div>
              `).join('') : '<p style="color:var(--muted)">No additional posters catalogued.</p>'}
            </div>
          </section>

          <!-- BACKDROP STILLS GALLERY -->
          ${(film.backdrops && film.backdrops.length > 0) ? `
            <section class="gallery-section" style="padding-top: 0;">
              <h3 class="section-heading">Cinematic Stills & Backdrops (${film.backdrops.length})</h3>
              <div class="gallery-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                ${film.backdrops.map((b, i) => `
                  <div class="gallery-item" style="aspect-ratio: 16/10;">
                    <img src="${b}" loading="lazy">
                    <div class="gallery-label">
                      <span>Still #${i+1}</span>
                      <a href="${b}" target="_blank" style="font-weight:900;">HIGH-RES ↗</a>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>
          ` : ''}
        `;
      } catch (err) {
        filmPageView.innerHTML = `<div class="error-box" style="margin: 3rem;">Failed to load film: ${err.message}</div>`;
      }
    }

    function openSaveModal() {
      if (!selectedFilm) return;
      const current = myFilms.find(f => f.id === selectedFilm.id) || selectedFilm;

      document.getElementById('savePreview').innerHTML = `
        <div style="display:flex; gap: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
          <img src="${current.poster}" style="width: 120px; aspect-ratio: 16/10; object-fit: cover;">
          <div>
            <h2 style="font-size: 1.4rem; font-weight: 900;">${current.title} (${current.year})</h2>
            <p style="font-size: 0.85rem; color: var(--muted); margin: 0.25rem 0;"><b>Director:</b> ${current.director}</p>
          </div>
        </div>
      `;

      if (current.dreadScore) document.getElementById('dreadInput').value = current.dreadScore;
      if (current.userRating) document.getElementById('ratingInput').value = current.userRating;
      if (current.status) document.getElementById('saveStatus').value = current.status;
      
      document.getElementById('dreadVal').innerText = document.getElementById('dreadInput').value + '/10';
      document.getElementById('ratingVal').innerText = document.getElementById('ratingInput').value + '/10';

      document.getElementById('saveModal').classList.add('active');
    }

    async function confirmSaveFilm() {
      const film = {
        ...selectedFilm,
        dreadScore: parseInt(document.getElementById('dreadInput').value),
        userRating: parseInt(document.getElementById('ratingInput').value),
        status: document.getElementById('saveStatus').value
      };

      myFilms = myFilms.filter(f => f.id !== film.id);
      myFilms.unshift(film);
      localStorage.setItem('a24_saved_films', JSON.stringify(myFilms));

      try {
        await fetch(`${WORKER_URL}/api/films`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(film)
        });
      } catch (e) {}

      closeModal('saveModal');
      openFilmPage(film.id);
    }

    function renderGrid() {
      const grid = document.getElementById('filmGrid');
      const countLabel = document.getElementById('itemCountLabel');
      let list = [...myFilms];

      if (currentFilter === 'watched') list = list.filter(f => f.status === 'watched');
      if (currentFilter === 'watchlist') list = list.filter(f => f.status === 'watchlist');
      if (currentFilter === 'top') list = list.sort((a,b) => (b.userRating || 0) - (a.userRating || 0));

      countLabel.innerText = `${list.length} ${list.length === 1 ? 'FILM' : 'FILMS'}`;

      if (!list.length) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 5rem 0; text-align: center; color: var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:700;">No films in this category. Click "+ Search & Add" above to start your archive.</div>`;
        return;
      }

      grid.innerHTML = list.map((f, idx) => `
        <article class="film-card" onclick="openFilmPage('${f.id}')">
          <div class="poster-wrapper">
            <img src="${f.poster}" alt="${f.title}" loading="lazy">
            <div class="badge">${f.status === 'watched' ? 'Watched' : 'Watchlist'}</div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--muted); font-weight:800; letter-spacing:0.05em;">
            <span>${currentFilter === 'top' ? `TOP #${idx + 1} — ` : ''}${f.year}</span>
            <span>RATING: ${f.userRating || 8}/10</span>
          </div>
          <h3 class="film-title">${f.title}</h3>
          <p class="film-credits"><b>DIR.</b> ${f.director} &nbsp;•&nbsp; <b>CAST:</b> ${f.starring}</p>
        </article>
      `).join('');
    }

    renderGrid();
  </script>
</body>
</html>
